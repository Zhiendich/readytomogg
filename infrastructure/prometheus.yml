global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api-gateway:4000"

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "auth-service:9101"

  - job_name: "user-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "user-service:9102"

  - job_name: "chat-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "chat-service:9103"

  - job_name: "payment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "payment-service:9104"

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "notification-service:9105"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"

  - job_name: "redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"

  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - "rabbitmq-exporter:9419"

  - job_name: "mongo"
    static_configs:
      - targets:
          - "mongodb-exporter:9216"

  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"
