groups:
  - name: services
    rules:
      - alert: ServiceDown
        expr: up{job=~"api-gateway|auth-service|user-service|chat-service|payment-service|notification-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} for more than 2 minutes."
